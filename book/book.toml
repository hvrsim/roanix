[book]
title = "Roanix Internals"
description = "General guide to the Roanix Operating System"
authors = ["Yusuf M"]
multilingual = false
language = "en"
src = "src"

[rust]
edition = "2021"

[output.html]
smart-punctuation = true
mathjax-support = true
site-url = "/roanix-internals/"

[output.html.playground]
editable = true
line-numbers = true

[output.html.code.hidelines]
python = "~"

[output.html.search]
limit-results = 20
use-boolean-and = true
boost-title = 2
boost-hierarchy = 2
boost-paragraph = 1
expand = true
heading-split-level = 2

[output.html.redirect]
"/format/config.html" = "configuration/index.html"