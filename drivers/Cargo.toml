[workspace]
members = [
    "ddk",
    "bus/pci",
    "platform/acpi",
    "platform/fdt",
    "irqchip/ioapic",
    "irqchip/plic",
    "tty/uart8250",
    "storage/nvme",
]
resolver = "3"

[profile.dev]
opt-level = 2
codegen-units = 1
panic = "abort"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
